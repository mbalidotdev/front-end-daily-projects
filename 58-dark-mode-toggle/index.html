<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Mode Demo</title>
    <link href="dist/output.css" rel="stylesheet" />
  </head>
  <body
    class="bg-white dark:bg-gray-900 text-gray-900 dark:text-white transition-colors duration-300"
  >
    <div class="container mx-auto px-4 py-8 max-w-2xl text-center">
      <h1 class="text-3xl font-bold mb-4">🌙 Dark Mode Demo</h1>
      <p class="mb-6 text-gray-600 dark:text-gray-400">
        Click the button below to toggle dark mode.
      </p>

      <button
        id="darkModeToggle"
        class="bg-blue-500 hover:bg-blue-600 text-white font-semibold px-6 py-3 rounded-lg transition"
      >
        Toggle Dark Mode
      </button>

      <div class="mt-8 bg-gray-100 dark:bg-gray-800 p-6 rounded-xl">
        <p>This card changes color in dark mode!</p>
      </div>

      <div class="mt-4 text-sm text-gray-500 dark:text-gray-400">
        The dark class is added to the HTML element when toggled.
      </div>
    </div>

    <script>
      const toggleButton = document.getElementById("darkModeToggle");

      toggleButton.addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");
      });
    </script>
  </body>
</html>
